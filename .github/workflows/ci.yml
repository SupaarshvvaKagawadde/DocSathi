name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolated-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load confined namespace host policy
        run: sudo apparmor_parser -r -W deploy/jky-parser-host.apparmor
      - name: Validate monitoring rules and failure cases
        run: |
          docker run --rm --network none --entrypoint promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e check rules /etc/prometheus/alerts.yml
          docker run --rm --network none --entrypoint promtool -w /etc/prometheus -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e test rules alerts.test.yml
      - name: Build production image
        run: docker build -t docsathi:verification .
      - name: Measure concurrent PDF and OCR capacity
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          --security-opt seccomp=deploy/parser-host-seccomp.json
          --security-opt apparmor=jky-parser-host
          --tmpfs /tmp:size=512m,mode=1777
          --pids-limit 256 --memory 2g --memory-swap 2g --cpus 2
          --entrypoint node docsathi:verification
          node_modules/tsx/dist/cli.mjs server/capacity.ts --sandbox --concurrency 3 --rounds 3
      - name: Exercise sandbox, repository recovery and production intake
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          --security-opt seccomp=deploy/parser-host-seccomp.json
          --security-opt apparmor=jky-parser-host
          --tmpfs /tmp:size=512m,mode=1777
          --pids-limit 256 --memory 2g --memory-swap 2g --cpus 2
          -e XDG_DATA_HOME=/tmp/.local/share
          -e TEST_OS_SANDBOX=1 -e TEST_DEPLOYMENT_SMOKE=1
          -e TEST_RESTIC_BINARY=/usr/bin/restic
          --entrypoint node docsathi:verification
          node_modules/vitest/vitest.mjs run --configLoader runner --fsModuleCachePath /tmp/vitest-cache
          tests/isolation.test.ts tests/offsite.test.ts tests/deployment.test.ts tests/recovery.test.ts tests/capacity.test.ts tests/recovery-rehearsal.test.ts tests/guardian-recovery-worker.test.ts
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Exercise local alert firing and recovery delivery
        run: |
          docker pull prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          docker pull prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          npm run monitoring:drill
      - run: npm run test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm audit --audit-level=high
