<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a6b" />
    <title>You are offline · DocSathi</title>
    <style>
      :root { color-scheme: light dark; --ink: #0c1b45; --ink-2: #36436b; --desk: #f3f5fa; --sheet: #ffffff; --gold: #c9a13b; --navy: #102a6b; }
      @media (prefers-color-scheme: dark) { :root { --ink: #eef0f6; --ink-2: #b5bccd; --desk: #0e1014; --sheet: #171a21; --navy: #e9ecf3; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--desk); color: var(--ink); font: 16px/1.55 system-ui, sans-serif; }
      main { max-width: 440px; padding: 32px 28px; border-radius: 18px; background: var(--sheet); box-shadow: 0 14px 32px -16px rgb(12 27 69 / 0.28); }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { margin: 18px 0 8px; font: 700 2rem/1.15 Georgia, 'Bodoni Moda', serif; }
      p { margin: 0 0 14px; color: var(--ink-2); }
      a { display: inline-block; margin-top: 6px; padding: 11px 20px; border-radius: 11px; background: #102a6b; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline.</h1>
      <p>Your documents are safe in your private account. Connect to the internet to open them.</p>
      <p>Uploads that were interrupted continue from where they stopped once you are back online.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
