global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: jky-folder
    metrics_path: /api/ops/metrics
    authorization:
      credentials_file: /run/secrets/monitor_token
    static_configs:
      - targets: ['app:3001']
