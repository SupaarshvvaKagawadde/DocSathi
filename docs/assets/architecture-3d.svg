<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 930" width="1280" height="930" role="img" aria-labelledby="t d"><title id="t">DocSathi architecture</title><desc id="d">Three isometric layers: the browser app on top; the API, inspection worker and mail/push workers in the middle; SQLite metadata, private originals and encrypted backups at the bottom.</desc><defs><marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9a13b"/></marker><marker id="down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102a6b" fill-opacity=".5"/></marker></defs><rect width="1280" height="930" rx="28" fill="#f3f5fa"/><text x="64.0" y="70.0" font-family="Bodoni Moda, Didot, 'Bodoni 72', Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#0c1b45" text-anchor="start">Architecture</text><text x="64.0" y="102.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#4a5678" text-anchor="start">One Node.js service in three layers. Private data stays on your server.</text><polygon points="408.1,733.0 667.9,883.0 667.9,895.0 408.1,745.0" fill="#c3cbdc"/><polygon points="849.8,778.0 667.9,883.0 667.9,895.0 849.8,790.0" fill="#aeb8cf"/><polygon points="590.0,628.0 849.8,778.0 667.9,883.0 408.1,733.0" fill="#dde3f0"/><polygon points="520.7,648.0 621.2,706.0 621.2,752.0 520.7,694.0" fill="#1b3a8c"/><polygon points="692.2,665.0 621.2,706.0 621.2,752.0 692.2,711.0" fill="#0b1f52"/><polygon points="591.7,607.0 692.2,665.0 621.2,706.0 520.7,648.0" fill="#3a589f"/><polygon points="635.0,714.0 735.5,772.0 735.5,818.0 635.0,760.0" fill="#1b3a8c"/><polygon points="806.5,731.0 735.5,772.0 735.5,818.0 806.5,777.0" fill="#0b1f52"/><polygon points="706.0,673.0 806.5,731.0 735.5,772.0 635.0,714.0" fill="#3a589f"/><polygon points="451.4,712.0 666.2,836.0 666.2,858.0 451.4,734.0" fill="#c9a13b"/><polygon points="716.4,807.0 666.2,836.0 666.2,858.0 716.4,829.0" fill="#8c6a1a"/><polygon points="501.7,683.0 716.4,807.0 666.2,836.0 451.4,712.0" fill="#e3c160"/><polygon points="408.1,498.0 667.9,648.0 667.9,660.0 408.1,510.0" fill="#cdd4e4"/><polygon points="849.8,543.0 667.9,648.0 667.9,660.0 849.8,555.0" fill="#b9c2d7"/><polygon points="590.0,393.0 849.8,543.0 667.9,648.0 408.1,498.0" fill="#e8ecf5"/><polygon points="520.7,419.0 621.2,477.0 621.2,517.0 520.7,459.0" fill="#4a66ab"/><polygon points="692.2,436.0 621.2,477.0 621.2,517.0 692.2,476.0" fill="#2a4a9e"/><polygon points="591.7,378.0 692.2,436.0 621.2,477.0 520.7,419.0" fill="#6a83bd"/><polygon points="635.0,485.0 735.5,543.0 735.5,583.0 635.0,525.0" fill="#4a66ab"/><polygon points="806.5,502.0 735.5,543.0 735.5,583.0 806.5,542.0" fill="#2a4a9e"/><polygon points="706.0,444.0 806.5,502.0 735.5,543.0 635.0,485.0" fill="#6a83bd"/><polygon points="451.4,477.0 666.2,601.0 666.2,623.0 451.4,499.0" fill="#6a83bd"/><polygon points="716.4,572.0 666.2,601.0 666.2,623.0 716.4,594.0" fill="#4a66ab"/><polygon points="501.7,448.0 716.4,572.0 666.2,601.0 451.4,477.0" fill="#8fa3d1"/><polygon points="408.1,263.0 667.9,413.0 667.9,425.0 408.1,275.0" fill="#dfe4ef"/><polygon points="849.8,308.0 667.9,413.0 667.9,425.0 849.8,320.0" fill="#cbd2e3"/><polygon points="590.0,158.0 849.8,308.0 667.9,413.0 408.1,263.0" fill="#ffffff"/><polygon points="477.4,253.0 590.0,318.0 590.0,328.0 477.4,263.0" fill="#1b3a8c"/><polygon points="711.2,248.0 590.0,318.0 590.0,328.0 711.2,258.0" fill="#0b1f52"/><polygon points="598.7,183.0 711.2,248.0 590.0,318.0 477.4,253.0" fill="#102a6b"/><polygon points="621.2,320.0 681.8,355.0 681.8,365.0 621.2,330.0" fill="#1b3a8c"/><polygon points="775.3,301.0 681.8,355.0 681.8,365.0 775.3,311.0" fill="#0b1f52"/><polygon points="714.7,266.0 775.3,301.0 681.8,355.0 621.2,320.0" fill="#102a6b"/><line x1="598.7" y1="202.5" x2="512.1" y2="252.5" stroke="#ffffff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/><line x1="617.7" y1="213.5" x2="531.1" y2="263.5" stroke="#ffffff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/><line x1="636.8" y1="224.5" x2="550.2" y2="274.5" stroke="#ffffff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/><line x1="594.3" y1="250.5" x2="300.0" y2="175.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="594.3" cy="250.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="290.0" y="172.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="end">Browser app</text><text x="290.0" y="192.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="end">React 19, Gold and Silver, installable</text><line x1="698.3" y1="310.5" x2="980.0" y2="175.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="698.3" cy="310.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="990.0" y="172.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="start">On-device tools</text><text x="990.0" y="192.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="start">Photo fitter, PDF preview</text><line x1="606.5" y1="427.5" x2="300.0" y2="400.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="606.5" cy="427.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="290.0" y="397.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="end">Express API</text><text x="290.0" y="417.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="end">Accounts, limits, checklists, reports</text><line x1="720.8" y1="493.5" x2="980.0" y2="400.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="720.8" cy="493.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="990.0" y="397.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="start">Inspection worker</text><text x="990.0" y="417.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="start">PDF text, English OCR; optional ClamAV</text><line x1="583.9" y1="524.5" x2="980.0" y2="470.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="583.9" cy="524.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="990.0" y="467.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="start">Optional mail and Web Push</text><text x="990.0" y="487.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="start">Recovery, guardian approval, reminders</text><line x1="606.5" y1="656.5" x2="300.0" y2="640.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="606.5" cy="656.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="290.0" y="637.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="end">SQLite metadata</text><text x="290.0" y="657.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="end">Accounts, applications, facts, audit</text><line x1="720.8" y1="722.5" x2="980.0" y2="640.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="720.8" cy="722.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="990.0" y="637.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="start">Private originals</text><text x="990.0" y="657.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="start">Exact bytes, hashed, never public</text><line x1="583.9" y1="759.5" x2="980.0" y2="710.0" stroke="#4a5678" stroke-opacity=".45" stroke-dasharray="3 4"/><circle cx="583.9" cy="759.5" r="4.5" fill="#c9a13b" stroke="#fff" stroke-width="1.5"/><text x="990.0" y="707.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="start">Encrypted backups</text><text x="990.0" y="727.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="start">Scheduled, AES-256-GCM</text><path d="M794.1 624.5 v-195.0" stroke="#c9a13b" stroke-width="2.5" fill="none" marker-end="url(#up)"/><path d="M808.1 429.5 v195.0" stroke="#102a6b" stroke-opacity=".5" stroke-width="2.5" fill="none" marker-end="url(#down)"/><path d="M794.1 389.5 v-195.0" stroke="#c9a13b" stroke-width="2.5" fill="none" marker-end="url(#up)"/><path d="M808.1 194.5 v195.0" stroke="#102a6b" stroke-opacity=".5" stroke-width="2.5" fill="none" marker-end="url(#down)"/><text x="64.0" y="890.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#4a5678" text-anchor="start">Optional outside services: SMTP for email, ClamAV for virus scanning, browser push services, and a reverse proxy for HTTPS.</text></svg>
