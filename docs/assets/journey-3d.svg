<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d"><title id="t">How DocSathi works</title><desc id="d">Six rising steps: upload originals, inspect and read, build the checklist, fix and match, review evidence, dated report.</desc><rect width="1280" height="660" rx="28" fill="#f3f5fa"/><text x="64.0" y="70.0" font-family="Bodoni Moda, Didot, 'Bodoni 72', Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#0c1b45" text-anchor="start">From a pile of files to a ready application</text><text x="64.0" y="102.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#4a5678" text-anchor="start">Each step builds on the one before. Nothing is marked ready until you confirm it.</text><ellipse cx="95.0" cy="528.0" rx="78" ry="20" fill="#102a6b" opacity=".08"/><polygon points="4.9,496.0 95.0,548.0 95.0,574.0 4.9,522.0" fill="#1b3a8c"/><polygon points="185.1,496.0 95.0,548.0 95.0,574.0 185.1,522.0" fill="#0b1f52"/><polygon points="95.0,444.0 185.1,496.0 95.0,548.0 4.9,496.0" fill="#5a74b3"/><text transform="translate(56.9,488.0) matrix(0.8660,0.5000,-0.8660,0.5000,0,0)" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">01</text><line x1="95.0" y1="484.0" x2="95.0" y2="434.0" stroke="#4a5678" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="95.0" y="386.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="middle">Upload originals</text><text x="95.0" y="407.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">PDF or JPEG, resumable</text><text x="95.0" y="424.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">on any network</text><ellipse cx="299.4" cy="528.0" rx="78" ry="20" fill="#102a6b" opacity=".08"/><polygon points="209.3,462.0 299.4,514.0 299.4,574.0 209.3,522.0" fill="#1b3a8c"/><polygon points="389.4,462.0 299.4,514.0 299.4,574.0 389.4,522.0" fill="#0b1f52"/><polygon points="299.4,410.0 389.4,462.0 299.4,514.0 209.3,462.0" fill="#4a66ab"/><text transform="translate(261.3,454.0) matrix(0.8660,0.5000,-0.8660,0.5000,0,0)" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">02</text><line x1="299.4" y1="450.0" x2="299.4" y2="400.0" stroke="#4a5678" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="299.4" y="352.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="middle">Inspect and read</text><text x="299.4" y="373.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">Virus scan, text, OCR</text><text x="299.4" y="390.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">facts and document type</text><ellipse cx="503.8" cy="528.0" rx="78" ry="20" fill="#102a6b" opacity=".08"/><polygon points="413.7,428.0 503.8,480.0 503.8,574.0 413.7,522.0" fill="#1b3a8c"/><polygon points="593.8,428.0 503.8,480.0 503.8,574.0 593.8,522.0" fill="#0b1f52"/><polygon points="503.8,376.0 593.8,428.0 503.8,480.0 413.7,428.0" fill="#3a589f"/><text transform="translate(465.7,420.0) matrix(0.8660,0.5000,-0.8660,0.5000,0,0)" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">03</text><line x1="503.8" y1="416.0" x2="503.8" y2="366.0" stroke="#4a5678" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="503.8" y="318.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="middle">Build the checklist</text><text x="503.8" y="339.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">From instructions PDF</text><text x="503.8" y="356.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">each item cites its page</text><ellipse cx="708.1" cy="528.0" rx="78" ry="20" fill="#102a6b" opacity=".08"/><polygon points="618.1,394.0 708.1,446.0 708.1,574.0 618.1,522.0" fill="#1b3a8c"/><polygon points="798.2,394.0 708.1,446.0 708.1,574.0 798.2,522.0" fill="#0b1f52"/><polygon points="708.1,342.0 798.2,394.0 708.1,446.0 618.1,394.0" fill="#2a4a9e"/><text transform="translate(670.0,386.0) matrix(0.8660,0.5000,-0.8660,0.5000,0,0)" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">04</text><line x1="708.1" y1="382.0" x2="708.1" y2="332.0" stroke="#4a5678" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="708.1" y="284.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="middle">Fix and match</text><text x="708.1" y="305.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">Photo fitter, name</text><text x="708.1" y="322.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">and date-of-birth check</text><ellipse cx="912.5" cy="528.0" rx="78" ry="20" fill="#102a6b" opacity=".08"/><polygon points="822.5,360.0 912.5,412.0 912.5,574.0 822.5,522.0" fill="#1b3a8c"/><polygon points="1002.6,360.0 912.5,412.0 912.5,574.0 1002.6,522.0" fill="#0b1f52"/><polygon points="912.5,308.0 1002.6,360.0 912.5,412.0 822.5,360.0" fill="#1b3a8c"/><text transform="translate(874.4,352.0) matrix(0.8660,0.5000,-0.8660,0.5000,0,0)" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">05</text><line x1="912.5" y1="348.0" x2="912.5" y2="298.0" stroke="#4a5678" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="912.5" y="250.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="middle">Review evidence</text><text x="912.5" y="271.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">Link pages, confirm</text><text x="912.5" y="288.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">unknowns stay visible</text><ellipse cx="1116.9" cy="528.0" rx="78" ry="20" fill="#102a6b" opacity=".08"/><polygon points="1026.8,326.0 1116.9,378.0 1116.9,574.0 1026.8,522.0" fill="#c9a13b"/><polygon points="1207.0,326.0 1116.9,378.0 1116.9,574.0 1207.0,522.0" fill="#8c6a1a"/><polygon points="1116.9,274.0 1207.0,326.0 1116.9,378.0 1026.8,326.0" fill="#e3c160"/><text transform="translate(1078.8,318.0) matrix(0.8660,0.5000,-0.8660,0.5000,0,0)" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#102a6b">06</text><line x1="1116.9" y1="314.0" x2="1116.9" y2="264.0" stroke="#4a5678" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="1116.9" y="216.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0c1b45" text-anchor="middle">Dated report</text><text x="1116.9" y="237.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">Print, JSON or ZIP</text><text x="1116.9" y="254.0" font-family="Manrope, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4a5678" text-anchor="middle">reminders before deadline</text></svg>
